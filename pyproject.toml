[project]
name = "novatrack"
version = "0.1.0"
description = "Self-hosted personal parcel tracking with OIDC, 17TRACK and signed notifications"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
  "fastapi==0.162.0", "uvicorn==0.54.0", "sqlalchemy==2.1.6",
  "alembic==1.20.1", "psycopg[binary]==3.3.6", "pydantic-settings==2.16.1",
  "authlib==1.9.1", "httpx==0.28.1", "jinja2==3.1.6",
  "python-multipart==0.0.32", "itsdangerous==2.2.0", "cryptography==50.0.2"
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.17.2"]

[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
